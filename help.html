<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help | Axia</title>

  <!-- Font: Poppins, all weights (from Google Fonts, needs internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS: shared files first, this page's file last -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/info.css">
</head>

<!-- data-page = current navbar link, data-root = path back to the main folder -->
<body data-page="help" data-root="../">

  <!-- The navbar is filled in by js/components.js -->
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="help-page" aria-labelledby="page-title">
      <h1 class="page-title" id="page-title">How Can We Help?</h1>
      <p class="page-lead">Click a category to view related questions, or</p>

      <!-- Search: js/help.js turns this button into a text box when clicked -->
      <form class="help-search" id="help-search" role="search">
        <button class="help-search-button" id="search-toggle" type="button">Click here to search for a question or topic</button>
      </form>

      <h2 class="help-subtitle" id="faq-heading">Frequently Asked Questions</h2>

      <!-- The 4 categories. Clicking one shows its questions (js/help.js) -->
      <ul class="category-grid" id="category-grid">
        <li><button class="category-button" type="button" data-category="getting-started">Getting Started</button></li>
        <li><button class="category-button" type="button" data-category="creating-collections">Creating Collections</button></li>
        <li><button class="category-button" type="button" data-category="saving-and-sharing">Saving and Sharing</button></li>
        <li><button class="category-button" type="button" data-category="account-and-access">Account and Access</button></li>
      </ul>

      <!-- Questions and answers appear here (filled in by js/help.js) -->
      <section class="faq-panel" id="faq-panel" aria-live="polite" hidden></section>
    </section>
  </main>

  <!-- Bottom teal band with the two account buttons -->
  <footer class="cta-band">
    <ul class="cta-list">
      <li><a class="btn btn-large btn-light" href="register.html">Create an Account</a></li>
      <li><a class="btn btn-large btn-light" href="login.html">Log In</a></li>
    </ul>
  </footer>

  <!-- Scripts last. Order matters: storage -> components -> this page -->
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/help.js"></script>
</body>
</html>
