<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help | Axia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/info.css">
  <link rel="stylesheet" href="../css/builder.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app workspace" data-page="settings" data-view="help" data-root="../">
  <div class="app-top"></div>
  <div class="app-body">
    <aside class="side" id="side"></aside>
    <main class="content">
      <div class="toprow">
        <a class="bar back" href="settings.html">‹ Help</a>
        <form class="help-search" id="help-search" role="search"><button class="help-search-button" id="search-toggle" type="button">Search for a question or topic</button></form>
      </div>
      <section class="spanel plain help-page">
        <h2 class="page-title">How Can We Help?</h2>
        <p class="page-lead">Click a category to view related questions.</p>
        <h2 class="help-subtitle" id="faq-heading">Frequently Asked Questions</h2>
        <ul class="category-grid" id="category-grid">
          <li><button class="category-button" type="button" data-category="getting-started">Getting Started</button></li>
          <li><button class="category-button" type="button" data-category="creating-collections">Creating Collections</button></li>
          <li><button class="category-button" type="button" data-category="saving-and-sharing">Saving and Sharing</button></li>
          <li><button class="category-button" type="button" data-category="account-and-access">Account and Access</button></li>
        </ul>
        <section class="faq-panel" id="faq-panel" aria-live="polite" hidden></section>
      </section>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/builder.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/settings.js"></script>
  <script src="../js/help.js"></script>
</body>
</html>
