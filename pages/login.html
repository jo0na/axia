<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Axia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth login" data-page="login" data-root="../">
  <header class="auth-top"><a href="register.html">New to Axia? <strong>Register Here</strong></a></header>
  <main class="auth-box">
    <h1>Axia</h1><p class="tag">Some things are worth returning to.</p>
    <div class="oauth"><button type="button" data-oauth>Log in with Apple</button><button type="button" data-oauth>Log in with Google</button></div><div class="or">OR</div>
    <form id="form" novalidate>
      <input type="email" id="email" placeholder="Enter your email:" autocomplete="email" aria-label="Enter your email">
      <input type="password" id="pw" placeholder="Enter your password:" autocomplete="current-password" aria-label="Enter your password">
      <a class="forgot" id="forgot" href="#">Forgot password?</a>
      <p class="auth-msg" id="msg" role="alert"></p>
      <button class="auth-btn" type="submit">Log In</button>
    </form>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
