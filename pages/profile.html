<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Axia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/info.css">
  <link rel="stylesheet" href="../css/builder.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app workspace" data-page="profile" data-view="profile" data-root="../">
  <div class="app-top"></div>
  <div class="app-body">
    <aside class="side" id="side"></aside>
    <main class="content">
      <a class="bar back" href="start.html">‹ Profile</a>
      <section class="spanel plain form-card profile-card">
        <img class="me-photo" id="pf-photo" alt="Your profile photo">
        <label class="flabel" for="pf-name">Username</label>
        <input class="finput" id="pf-name" type="text" maxlength="30" autocomplete="username">
        <p class="flabel">Profile photo</p>
        <div class="upload-row">
          <label class="bt teal upload">Attach a photo<input id="pf-file" type="file" accept="image/*"></label>
          <span class="upload-note" id="pf-file-note">JPG or PNG, up to 5MB</span>
        </div>
        <p class="flabel">Or choose a free default avatar</p>
        <div class="avatars" id="pf-avatars"></div>
        <p class="fmsg" id="pf-msg" role="alert"></p>
        <button class="bt teal" id="pf-save" type="button">Save</button>
      </section>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/builder.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
