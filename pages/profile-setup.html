<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up your profile | Axia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth" data-page="profile-setup" data-root="../">
  <header class="auth-top"></header>
  <main class="auth-box">
    <h1>Set up your profile.</h1>
    <form id="form" novalidate>
      <h2>Username*</h2>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="off" aria-label="Enter your username">
      <h2>Upload your profile photo</h2>
      <div class="photo-row"><img class="me-photo" id="preview" src="../assets/images/avatars/default-profile.png" alt="Profile preview"><input type="file" id="photo" accept="image/*" aria-label="Choose profile photo"></div>
      <h2>Or choose a free default avatar</h2>
      <div class="avatars" id="avatars"></div>
      <p class="auth-msg" id="msg" role="alert"></p>
      <button class="auth-btn" type="submit">Create an Account</button>
    </form>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
