<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email & Password | Axia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/info.css">
  <link rel="stylesheet" href="../css/builder.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app workspace" data-page="account" data-view="account" data-root="../">
  <div class="app-top"></div>
  <div class="app-body">
    <aside class="side" id="side"></aside>
    <main class="content">
      <a class="bar back" href="start.html">‹ Email &amp; Password</a>
      <section class="spanel plain form-card">
        <label class="flabel" for="ac-email">Email address</label>
        <input class="finput" id="ac-email" type="email" autocomplete="email">
        <p class="flabel">Change password (leave blank to keep your current one)</p>
        <input class="finput" id="ac-old" type="password" placeholder="Current password" autocomplete="current-password" aria-label="Current password">
        <input class="finput" id="ac-new" type="password" placeholder="New password (at least 6 characters)" autocomplete="new-password" aria-label="New password">
        <input class="finput" id="ac-new2" type="password" placeholder="Confirm new password" autocomplete="new-password" aria-label="Confirm new password">
        <p class="fmsg" id="ac-msg" role="alert"></p>
        <button class="bt teal" id="ac-save" type="button">Save</button>
      </section>
    </main>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/builder.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
